[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ib-eval"
version = "0.1.0"
description = "Deterministic investment-banking AI evaluation benchmark — Northstar Components v1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "openpyxl>=3.1",
]

[project.scripts]
ib-eval = "ib_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ib_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = []

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "strict"
